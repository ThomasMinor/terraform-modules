# This is a GitHub Action workflow to ensure basic Terraform quality checks.
name: Terraform CI

on:
  # Run on pushes to the main branch
  push:
    branches:
      - main
  # Run on pull requests targeting the main branch
  pull_request:
    branches:
      - main

jobs:
  terraform_checks:
    name: 'Terraform Format and Validate'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Set up Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          # You can specify a specific Terraform version here
          terraform_version: "1.5.0"

      - name: 'Terraform Init'
        # Initializes Terraform, downloading providers.
        # The -backend=false flag is used as we are not managing remote state in this CI job.
        run: terraform init -backend=false

      - name: 'Terraform Format Check'
        # The -check flag will cause the command to fail if the code is not formatted.
        run: terraform fmt -check -recursive

      - name: 'Terraform Validate'
        # Validates the syntax and arguments of the Terraform configuration.
        run: terraform validate
